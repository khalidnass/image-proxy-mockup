# LiteLLM: the model entry and the one setting. Two parts of config.yaml.

model_list:
  - model_name: image-proxy-mockup
    litellm_params:
      model: openai/image-proxy-mockup          # openai/<the name the proxy serves>
      api_base: http://image-proxy.<your-namespace>.svc:8080/v1
      api_key: os.environ/IMAGE_PROXY_API_KEY    # the proxy's PROXY_API_KEY
      timeout: 280                               # above the proxy's deadline, below the route's
    model_info:
      mode: image_generation
      # access_groups: [<your group>]            # if your keys hold models by access group

litellm_settings:
  model_group_settings:
    # LiteLLM passes the caller's x- headers to THESE models only. The gateway
    # writes the user id into x-litellm-customer-id; this setting is what
    # carries it on to the proxy, which refuses a call without it (403).
    # Name only the image proxy here.
    forward_client_headers_to_llm_api:
      - image-proxy-mockup

# The same model through the API instead of config.yaml (store_model_in_db: true):
#   POST /model/new
#   {"model_name": "image-proxy-mockup",
#    "litellm_params": {"model": "openai/image-proxy-mockup",
#                       "api_base": "http://image-proxy.<your-namespace>.svc:8080/v1",
#                       "api_key": "<the proxy's PROXY_API_KEY>", "timeout": 280},
#    "model_info": {"mode": "image_generation"}}
# The forward setting itself has to be in config.yaml (litellm_settings), and
# LiteLLM reads it at start: restart LiteLLM after adding it.
#
# The proxy calls its three model servers (create, edit, LLM) directly: those
# calls do not pass LiteLLM. Nothing for them here.
