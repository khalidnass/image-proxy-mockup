# The image proxy and the mock backend, for any Kubernetes cluster.
# Fill every <your ...> value. Apply with:  kubectl -n <your-namespace> apply -f deploy/
#
# The Secret holds the proxy's keys (do not keep the values in git):
#   PROXY_API_KEY  required: the key LiteLLM sends; the same value is the LiteLLM
#                  model entry's api_key (examples/litellm-model.yaml)
#   IMAGE_CREATE_API_KEY, IMAGE_EDIT_API_KEY, LLM_API_KEY
#                  optional: each model server's own key (blank: no header
#                  sent); each goes to its own server only
#   kubectl -n <your-namespace> create secret generic image-proxy \
#     --from-literal=PROXY_API_KEY="$(openssl rand -hex 32)" \
#     --from-literal=IMAGE_CREATE_API_KEY="<or leave out>" \
#     --from-literal=IMAGE_EDIT_API_KEY="<or leave out>" \
#     --from-literal=LLM_API_KEY="<or leave out>"
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-proxy
data:
  # Who the person is: the header the gateway writes (and LiteLLM forwards).
  # No user id: 403.
  USER_ID_HEADER: "x-litellm-customer-id"
  # true: use the body's `user` when the header is absent. A caller can write
  # that field itself, so it can be faked: keep false.
  TRUST_BODY_USER: "false"
  # The three model servers, called directly in the OpenAI format (for
  # example vLLM). The mock in deploy/mock-backend.yaml can play all three.
  IMAGE_CREATE_URL: "http://vllm-image.<your-namespace>.svc:8000"      # /v1/images/generations
  IMAGE_CREATE_MODEL: "<the model name it serves>"                   # mock: mock-image
  IMAGE_EDIT_URL: "http://vllm-image-edit.<your-namespace>.svc:8000"  # /v1/images/edits
  IMAGE_EDIT_MODEL: "<the model name it serves>"                     # mock: mock-image-edit
  LLM_BASE_URL: "http://vllm-llm.<your-namespace>.svc:8000/v1"        # /v1/chat/completions
  ENRICH_MODEL: "<the chat model name>"                              # mock: mock-llm
  SERVED_MODELS: "image-proxy-mockup"
  REQUEST_DEADLINE_SECONDS: "240"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-proxy
  labels: {app: image-proxy}
spec:
  replicas: 1
  selector: {matchLabels: {app: image-proxy}}
  template:
    metadata:
      labels: {app: image-proxy}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: proxy
          image: <your registry>/image-proxy-mockup:0.4.0
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: image-proxy}
            - secretRef: {name: image-proxy}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: image-proxy
spec:
  selector: {app: image-proxy}
  ports: [{port: 8080, targetPort: 8080}]
---
# Only LiteLLM may reach the proxy. Set the selector to your LiteLLM pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: image-proxy
spec:
  podSelector: {matchLabels: {app: image-proxy}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: <your litellm pod label>}}
      ports: [{port: 8080}]
